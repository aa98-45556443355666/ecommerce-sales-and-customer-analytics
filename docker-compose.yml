x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow

  image: ecommerce-airflow:local

  profiles:
    - airflow

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Add AIRFLOW_DB_PASSWORD to .env}@airflow-db:5432/airflow"

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-local_dev_secret}"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

    AIRFLOW_ADMIN_USER: "${AIRFLOW_ADMIN_USER:-admin}"
    AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?Add AIRFLOW_ADMIN_PASSWORD to .env}"
    AIRFLOW_UID: "${AIRFLOW_UID:-50000}"

    PROJECT_DIR: /opt/airflow/project

    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "${POSTGRES_DB:-ecommerce_db}"
    POSTGRES_USER: "${POSTGRES_USER:-ecommerce}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./:/opt/airflow/project

  user: "${AIRFLOW_UID:-50000}:0"

services:

  # ---------------------------------------------------------
  # APPLICATION DATABASE
  # ---------------------------------------------------------

  postgres:
    image: postgres:16
    container_name: ecommerce_postgres

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ecommerce_db}"
      POSTGRES_USER: "${POSTGRES_USER:-ecommerce}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to .env}"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # EXISTING MANUAL SPARK SERVICE
  # ---------------------------------------------------------

  spark:
    image: spark:4.2.0-java21-python3

    profiles:
      - spark

    working_dir: /app

    volumes:
      - ./:/app

    entrypoint:
      - /opt/spark/bin/spark-submit

    command:
      - /app/spark/sales_aggregation.py

    environment:
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

  # ---------------------------------------------------------
  # AIRFLOW METADATA DATABASE
  # ---------------------------------------------------------

  airflow-db:
    image: postgres:16

    profiles:
      - airflow

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?Add AIRFLOW_DB_PASSWORD to .env}"
      POSTGRES_DB: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # AIRFLOW INITIALIZATION
  # ---------------------------------------------------------

  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - |
        set -e

        airflow db migrate

        if airflow users list --output json | python -c 'import json, os, sys; username = os.environ["AIRFLOW_ADMIN_USER"]; users = json.load(sys.stdin); sys.exit(0 if any(user.get("username") == username for user in users) else 1)'; then
          echo "Airflow admin user already exists."
        else
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USER}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Project \
            --lastname Admin \
            --role Admin \
            --email admin@example.com
        fi

    depends_on:
      airflow-db:
        condition: service_healthy

    restart: "no"

  # ---------------------------------------------------------
  # SHARED DATA VOLUME PERMISSIONS
  # ---------------------------------------------------------

  airflow-data-init:
    <<: *airflow-common

    user: "0:0"

    entrypoint:
      - /bin/bash
      - -ec

    command:
      - |
        mkdir -p /opt/airflow/project/data/processed
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/project/data/processed
        chmod -R g+rwX /opt/airflow/project/data/processed
        chmod 2775 /opt/airflow/project/data/processed

    volumes:
      - ./:/opt/airflow/project
      - processed_data:/opt/airflow/project/data/processed

    restart: "no"

  # ---------------------------------------------------------
  # AIRFLOW WEBSERVER
  # ---------------------------------------------------------

  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

  # ---------------------------------------------------------
  # AIRFLOW SCHEDULER
  # ---------------------------------------------------------

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Add AIRFLOW_DB_PASSWORD to .env}@airflow-db:5432/airflow"
      ECOMMERCE_PROJECT_ROOT: /opt/airflow/project
      POWERBI_DB_HOST: ecommerce_postgres

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - processed_data:/opt/airflow/project/data/processed
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data:
  airflow_db_data:

  processed_data:
    name: ecommerce_processed_data
